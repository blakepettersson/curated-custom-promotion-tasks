name: flux-reconcile

# Builds the flux-reconcile custom promotion step image, proves it against real
# Flux controllers, and publishes it to GHCR. Nothing is pushed unless lint and
# both test suites pass.
#
#   pull request              -> lint + test only
#   push to main              -> :main and :sha-<short sha>
#   tag flux-reconcile/v1.2.3 -> :v1.2.3, :v1.2 and :latest
on:
  pull_request:
    paths:
      - flux/steps/flux-reconcile/**
      - flux/examples/flux-app/**
      - flux/Makefile
      # The example task is linted with the oci family's linter.
      - oci/test/lint-task.py
      - .github/workflows/flux-reconcile.yaml
  push:
    branches:
      - main
    tags:
      - flux-reconcile/v*
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/flux-reconcile

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flux/steps/flux-reconcile
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck --shell=sh src/flux-reconcile
          shellcheck test/helpers.bash test/*.bats

  # Both suites need Flux, so both run here against one kind cluster:
  # FLUX_E2E_KEEP leaves the cluster from the first for the second to reuse.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flux/steps/flux-reconcile
    env:
      IMAGE: flux-reconcile:ci
      FLUX_E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Single platform here: the tests only need something runnable, and the
      # layer cache is shared with the publish job below.
      - name: Build step image
        uses: docker/build-push-action@v6
        with:
          context: flux/steps/flux-reconcile
          load: true
          tags: flux-reconcile:ci
          cache-from: type=gha,scope=flux-reconcile
          cache-to: type=gha,mode=max,scope=flux-reconcile

      # Pinned rather than apt's, which lags. bats is not preinstalled on the
      # runners.
      - name: Install bats
        env:
          BATS_VERSION: 1.13.0
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" | tar -xz
          sudo "./bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf "./bats-core-${BATS_VERSION}"
          bats --version

      - uses: azure/setup-helm@v4

      - uses: azure/setup-kubectl@v4

      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Step behaviour tests
        run: bats test/flux-reconcile.bats

      - name: Example end to end
        run: bats test/e2e-example.bats

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Without these, the action derives title and description from the
          # repository and passes them as --label, overriding the Dockerfile's:
          # every step image would advertise itself as the repository.
          labels: |
            org.opencontainers.image.title=flux-reconcile
            org.opencontainers.image.description=Kargo custom promotion step that reconciles Flux Kustomizations and HelmReleases and waits for the promoted revision
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=v(\d+\.\d+\.\d+),group=0
            type=match,pattern=v(\d+\.\d+)\.\d+,group=1,prefix=v
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/flux-reconcile/v') }}

      # Kargo runs custom step images on linux/amd64 and linux/arm64. Nothing is
      # compiled or installed in the image, so both platforms build from the
      # same COPY instructions with no emulation.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: flux/steps/flux-reconcile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=flux-reconcile
          cache-to: type=gha,mode=max,scope=flux-reconcile

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Summary
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
