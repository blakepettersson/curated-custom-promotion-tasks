name: oci-tasks

# Lints the OCI promotion tasks and runs both of their suites.
#
# There is no publish job, unlike the step workflows: this family composes
# Kargo's built-in steps and ships YAML, so there is no image to build and a
# merge to main is the release.
#
#   pull request -> lint + test + e2e
#   push to main -> lint + test + e2e
on:
  pull_request:
    paths:
      - oci/**
      - .github/workflows/oci-tasks.yaml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oci
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

  # Checks every task against the Kargo step config schemas vendored in
  # oci/test/schemas, and every stage example against the task it calls.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oci
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than apt's, which lags. bats is not preinstalled on the
      # runners.
      - name: Install bats
        env:
          BATS_VERSION: 1.13.0
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" | tar -xz
          sudo "./bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf "./bats-core-${BATS_VERSION}"
          bats --version

      - name: Test
        run: make test

  # Renders oci/examples/example-app and pushes it to a throwaway registry, so
  # the media types and layout the tasks rely on are checked against something
  # that reads them. Needs helm and kustomize; docker is already on the runner.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oci
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than apt's, which lags. bats is not preinstalled on the
      # runners.
      - name: Install bats
        env:
          BATS_VERSION: 1.13.0
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" | tar -xz
          sudo "./bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf "./bats-core-${BATS_VERSION}"
          bats --version

      - uses: azure/setup-helm@v4

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: 5.8.1
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -C /usr/local/bin -xz kustomize
          kustomize version

      - name: End-to-end
        run: make e2e
