name: kyverno-validate

# Builds the kyverno-validate custom promotion step image, proves it works, and
# publishes it to GHCR. Nothing is pushed unless lint and both test suites pass.
#
#   pull request                -> lint + test only
#   push to main                -> :main and :sha-<short sha>
#   tag kyverno-validate/v1.2.3 -> :v1.2.3, :v1.2 and :latest
on:
  pull_request:
    paths:
      - kyverno/steps/kyverno-validate/**
      - kyverno/examples/kyverno-policies/**
      - .github/workflows/kyverno-validate.yaml
  push:
    branches:
      - main
    tags:
      - kyverno-validate/v*
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/kyverno-validate

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyverno/steps/kyverno-validate
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck --shell=sh src/kyverno-validate
          shellcheck test/helpers.bash test/*.bats

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyverno/steps/kyverno-validate
    env:
      IMAGE: kyverno-validate:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Single platform here: the tests only need something runnable, and the
      # layer cache is shared with the publish job below.
      - name: Build step image
        uses: docker/build-push-action@v6
        with:
          context: kyverno/steps/kyverno-validate
          load: true
          tags: kyverno-validate:ci
          cache-from: type=gha,scope=kyverno-validate
          cache-to: type=gha,mode=max,scope=kyverno-validate

      # Pinned rather than apt's, which lags. bats is not preinstalled on the
      # runners.
      - name: Install bats
        env:
          BATS_VERSION: 1.13.0
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" | tar -xz
          sudo "./bats-core-${BATS_VERSION}/install.sh" /usr/local
          rm -rf "./bats-core-${BATS_VERSION}"
          bats --version

      - name: Step behaviour tests
        run: bats test/kyverno-validate.bats

      - uses: azure/setup-helm@v4

      - name: Example chart end to end
        run: bats test/e2e-chart.bats

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Without these, the action derives title and description from the
          # repository and passes them as --label, overriding the Dockerfile's:
          # every step image would advertise itself as the repository.
          labels: |
            org.opencontainers.image.title=kyverno-validate
            org.opencontainers.image.description=Kargo custom promotion step that validates Kyverno policies with the Kyverno CLI
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=v(\d+\.\d+\.\d+),group=0
            type=match,pattern=v(\d+\.\d+)\.\d+,group=1,prefix=v
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/kyverno-validate/v') }}

      # Kargo runs custom step images on linux/amd64 and linux/arm64. Nothing is
      # compiled or installed in the image, so both platforms build from the
      # same COPY instructions with no emulation.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: kyverno/steps/kyverno-validate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=kyverno-validate
          cache-to: type=gha,mode=max,scope=kyverno-validate

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Summary
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
