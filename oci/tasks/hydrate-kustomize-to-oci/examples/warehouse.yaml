# The Warehouse the hydrating Stage draws Freight from: the config repository
# holding the base and overlays, plus the application image they deploy.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: example-app
  namespace: example-app
spec:
  interval: 5m
  subscriptions:
    - git:
        repoURL: https://github.com/example/example-app.git
    - image:
        repoURL: ghcr.io/example/example-app
        imageSelectionStrategy: SemVer
