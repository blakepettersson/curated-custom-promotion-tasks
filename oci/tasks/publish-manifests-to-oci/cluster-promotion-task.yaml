# Publishes a directory of already-rendered manifests to an OCI registry as an
# OCI 1.1 artifact, and records what it published on the Freight.
#
# This is the second half of the hydrate tasks, on its own, so that the caller
# can decide what goes into the directory first. Its reason for existing is
# rendering every Stage in one promotion: a promotion template renders each
# Stage into its own subdirectory of ./manifests, then calls this task once, and
# every Stage in the pipeline deploys the same artifact digest with its Argo CD
# Application's `path` selecting its own subdirectory.
#
#   git-clone
#   helm-template  ->  ./manifests/test
#   helm-template  ->  ./manifests/stage
#   helm-template  ->  ./manifests/prod
#   publish-manifests-to-oci
#
# A Stage that renders only itself uses the same task with one render step
# instead of three; see examples/single-stage.yaml. There is deliberately no
# all-in-one "clone, render, push" task: it could only ever render one Stage,
# since a promotion's steps are static and Kargo has no loop construct.
#
# Register it once per cluster, then reference it from any project's promotion
# template (see examples/stage.yaml).
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: publish-manifests-to-oci
spec:
  vars:
    # OCI repository the artifact is published to, without a tag. Required.
    # e.g. ghcr.io/example/config/app
    - name: ociRepo
    # Git repository the manifests were rendered from. Required, and recorded on
    # the artifact as provenance — an artifact of rendered manifests is useless
    # without a way back to its source.
    - name: repoURL
    # Directory of rendered manifests to publish. Everything beneath it is
    # included, so subdirectories become paths within the artifact.
    - name: manifestsPath
      value: ./manifests
    # Immutable tag. One per promotion, so a rollback has something to point at.
    - name: tag
      value: ${{ ctx.promotion }}
    # Mutable tag, moved to each promotion's artifact. This is what a downstream
    # Warehouse subscribes to. Set it to the same value as `tag` to publish only
    # the immutable tag.
    #
    # Defaulted to the *publishing* Stage's name. When one Stage renders for the
    # whole pipeline, that is the name of the pipeline's entry Stage, not of the
    # Stage a given artifact is destined for — the artifact is for all of them.
    - name: mutableTag
      value: ${{ ctx.stage }}

  steps:
    # `gzip: true` is not optional. The `tar` step defaults to an uncompressed
    # archive while `oci-push` defaults the layer media type to
    # application/vnd.oci.image.layer.v1.tar+gzip, so omitting it publishes a
    # plain tar labelled as gzip, which Argo CD's repo-server cannot decompress.
    - uses: tar
      as: archive
      config:
        inPath: ${{ vars.manifestsPath }}
        outPath: ./manifests.tar.gz
        gzip: true

    # `mediaType` and `artifactType` are deliberately left unset. The defaults
    # are application/vnd.oci.image.layer.v1.tar+gzip for the layer — one of the
    # three types in Argo CD's repo-server allow-list — and the OCI empty
    # descriptor for the config.
    - uses: oci-push
      as: push
      config:
        srcPath: ./manifests.tar.gz
        destRef: ${{ vars.ociRepo }}:${{ vars.tag }}
        annotations:
          org.opencontainers.image.source: ${{ vars.repoURL }}
          org.opencontainers.image.revision: ${{ commitFrom(vars.repoURL).ID }}
          io.kargo.project: ${{ ctx.project }}
          io.kargo.stage: ${{ ctx.stage }}
          io.kargo.promotion: ${{ ctx.promotion }}

    # A same-repository retag of the digest just pushed: no blob transfer, no
    # artifact size check, and — because no annotations are given — the manifest
    # bytes are republished untouched, so `mutableTag` resolves to exactly the
    # digest above.
    - uses: oci-push
      as: retag
      config:
        srcRef: ${{ vars.ociRepo }}@${{ task.outputs.push.digest }}
        destRef: ${{ vars.ociRepo }}:${{ vars.mutableTag }}

    # Records the artifact on the Freight, so that a *downstream Stage in the
    # same pipeline* can deploy it without a Warehouse of its own. This is what
    # keeps one Freight — one commit, one set of image digests — flowing through
    # the whole pipeline: the manifests become a property of that Freight rather
    # than a new Freight of their own.
    #
    # `deploy-oci-to-argocd` reads this by default. A Stage on the far side of a
    # boundary this metadata cannot cross — another Kargo instance, an
    # air-gapped enclave — needs a Warehouse subscribed to the registry instead;
    # see that task's README.
    - uses: set-metadata
      as: record
      config:
        updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              ociManifests:
                repo: ${{ vars.ociRepo }}
                digest: ${{ task.outputs.push.digest }}
                tag: ${{ task.outputs.push.tag }}
                mutableTag: ${{ vars.mutableTag }}

    # Expose the results to the promotion template that called this task.
    # `ref` is the immutable, digest-pinned reference: the one to record in a
    # commit message, a notification, or an Argo CD Application.
    - uses: compose-output
      as: output
      config:
        ref: ${{ vars.ociRepo }}@${{ task.outputs.push.digest }}
        digest: ${{ task.outputs.push.digest }}
        tag: ${{ task.outputs.push.tag }}
        mutableTag: ${{ vars.mutableTag }}
        ociRepo: ${{ vars.ociRepo }}
        manifestsPath: ${{ vars.manifestsPath }}
