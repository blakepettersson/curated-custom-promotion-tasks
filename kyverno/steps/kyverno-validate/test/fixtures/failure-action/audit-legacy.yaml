# `validationFailureAction: Audit` — the policy-level spelling.
# Audit only changes what an admission controller does in a live cluster; the
# CLI still reports a violation as `fail`, never as `warn`.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: audit-legacy
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-repo
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container image does not match an allowed repository prefix."
        foreach:
          - list: "request.object.spec.containers[]"
            anyPattern:
              - image: "registry.example.com/*"
