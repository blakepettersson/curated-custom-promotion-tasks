# `validationFailureAction: Enforce` — the policy-level spelling.
# The Enforce counterpart of audit-legacy.yaml, kept so the pair can be compared
# result for result.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-legacy
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-repo
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container image does not match an allowed repository prefix."
        foreach:
          - list: "request.object.spec.containers[]"
            anyPattern:
              - image: "registry.example.com/*"
