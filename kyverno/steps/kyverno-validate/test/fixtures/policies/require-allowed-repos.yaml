apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-repos
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-repo
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container image does not match an allowed repository prefix."
        foreach:
          - list: "request.object.spec.containers[]"
            anyPattern:
              - image: "registry.example.com/*"
