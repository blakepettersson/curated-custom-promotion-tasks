apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: invalid-enum
spec:
  # Not one of Audit/Enforce — the sort of typo a bad Helm value produces.
  validationFailureAction: Bogus
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "An image tag is required."
        pattern:
          spec:
            containers:
              - image: "*:*"
