apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: demo
  install:
    createNamespace: true
  chart:
    spec:
      chart: demo
      # Written by Kargo's yaml-update step on every promotion.
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: charts
