# Something for Helm's wait, and the Kustomization's after it, to wait on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        chartVersion: {{ .Chart.Version | quote }}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
