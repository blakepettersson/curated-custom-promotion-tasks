apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-app
  # Without `wait`, Ready on this Kustomization would mean only that the apply
  # went through. With it, Ready means what it applied — here the HelmRelease
  # — is Ready too, and flux-reconcile reports the target as health-checked.
  wait: true
  timeout: 5m
