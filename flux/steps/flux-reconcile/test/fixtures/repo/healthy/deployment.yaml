# Becomes Available within seconds, so a Kustomization with `wait: true` over
# it passes its health check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy
spec:
  replicas: 1
  selector:
    matchLabels: {app: healthy}
  template:
    metadata:
      labels: {app: healthy}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
