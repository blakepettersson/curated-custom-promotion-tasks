# What the Flux objects under test fetch from, inside the test cluster: a Git
# server and a registry. Neither is a model of production.
#
#   * Gitea, not the nginx-over-dumb-HTTP server oci/ uses. Kargo's git CLI
#     clones dumb HTTP; Flux's source-controller uses go-git, which speaks only
#     the smart protocol and fails with "unexpected EOF". Gitea serves smart
#     HTTP from a single container on sqlite, and creates a repository on its
#     first push, so the only setup is one user.
#   * A registry for the chart a HelmRelease pulls through an OCIRepository.
#     source-controller is pointed at its ClusterIP with `insecure: true`.
apiVersion: v1
kind: Namespace
metadata:
  name: flux-e2e-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: flux-e2e-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.27.2-rootless
          env:
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              value: http://gitea.flux-e2e-infra.svc.cluster.local:3000/
            # The suite pushes a repository into existence, and Flux clones it
            # anonymously.
            - name: GITEA__repository__ENABLE_PUSH_CREATE_USER
              value: "true"
            - name: GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE
              value: "false"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: flux-e2e-infra
spec:
  selector:
    app: gitea
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: flux-e2e-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: flux-e2e-infra
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
---
# An identity with no Flux permissions at all, for the case that checks a
# denied request is reported as misconfiguration.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-access
  namespace: flux-e2e-infra
---
apiVersion: v1
kind: Secret
metadata:
  name: no-access-token
  namespace: flux-e2e-infra
  annotations:
    kubernetes.io/service-account.name: no-access
type: kubernetes.io/service-account-token
