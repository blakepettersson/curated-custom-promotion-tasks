# Applied to the cluster Flux runs in: the identity flux-reconcile uses there.
#
# The step reads Flux objects and annotates them with
# `reconcile.fluxcd.io/requestedAt` — `get` and `patch`, on Flux's own kinds,
# and nothing else. It never changes a spec, never touches a workload, and
# cannot read a Secret.
#
# A ClusterRole so one definition serves every namespace; bind it with a
# RoleBinding per namespace instead of the ClusterRoleBinding below to confine
# the step to the namespaces a Kargo project owns.
#
# Then build a kubeconfig from the token Secret below and store it in Kargo —
# see kargo-secret.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-flux-reconcile
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-flux-reconcile
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, buckets, helmrepositories, helmcharts]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kargo-flux-reconcile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-flux-reconcile
subjects:
  - kind: ServiceAccount
    name: kargo-flux-reconcile
    namespace: flux-system
---
# A long-lived token for the ServiceAccount. Kubernetes fills in `token` and
# `ca.crt`; rotate by deleting and re-creating this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kargo-flux-reconcile-token
  namespace: flux-system
  annotations:
    kubernetes.io/service-account.name: kargo-flux-reconcile
type: kubernetes.io/service-account-token
