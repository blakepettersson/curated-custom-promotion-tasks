# Lives in the Kargo project namespace, where `secret('flux-cluster')` in a
# promotion reads it. The `generic` credential type is what makes it readable
# by expressions; Kargo never uses it as Git or registry credentials.
#
# The kubeconfig is for the cluster Flux runs in, as the identity in rbac.yaml.
# From that cluster:
#
#   TOKEN=$(kubectl -n flux-system get secret kargo-flux-reconcile-token \
#     -o jsonpath='{.data.token}' | base64 -d)
#   CA=$(kubectl -n flux-system get secret kargo-flux-reconcile-token \
#     -o jsonpath='{.data.ca\.crt}')
#
# and a server address the Kargo agent's cluster can reach. Static credentials
# only — a token, or a client certificate: the step's image carries no exec
# credential plugins (aws, gke-gcloud-auth-plugin, kubelogin).
apiVersion: v1
kind: Secret
metadata:
  name: flux-cluster
  namespace: flux-demo
  labels:
    kargo.akuity.io/cred-type: generic
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: flux
        cluster:
          server: https://flux-cluster.example.com:6443
          certificate-authority-data: <CA>
    users:
      - name: kargo-flux-reconcile
        user:
          token: <TOKEN>
    contexts:
      - name: flux
        context:
          cluster: flux
          user: kargo-flux-reconcile
    current-context: flux
